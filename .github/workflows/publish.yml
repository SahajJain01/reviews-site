name: publish

# Validates the vault, makes cutouts for new photos, builds and deploys bebi.fyi.
# Runs here on push/manual, and is called by SahajJain01/reviews-vault on every vault push.
on:
  workflow_call:
    secrets:
      CLOUDFLARE_API_TOKEN: { required: true }
      CLOUDFLARE_ACCOUNT_ID: { required: true }
      SITE_DEPLOY_KEY: { required: false }
      VAULT_DEPLOY_KEY: { required: false }
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout site
        uses: actions/checkout@v5
        with:
          repository: SahajJain01/reviews-site
          ref: main
          path: site
          # From the vault repo, a write deploy key lets us push cutouts back to the site repo.
          ssh-key: ${{ github.repository == 'SahajJain01/reviews-vault' && secrets.SITE_DEPLOY_KEY || '' }}

      - name: Checkout vault
        uses: actions/checkout@v5
        with:
          repository: SahajJain01/reviews-vault
          path: vault
          # From the site repo, a read-only deploy key reads the private vault.
          ssh-key: ${{ github.repository == 'SahajJain01/reviews-site' && secrets.VAULT_DEPLOY_KEY || '' }}

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install
        working-directory: site
        run: npm ci --no-audit --no-fund

      - name: Tests
        working-directory: site
        run: npm test

      - name: Validate reviews
        id: prepare
        working-directory: site
        run: node scripts/prepare.ts ../vault

      - name: Set up uv
        if: steps.prepare.outputs.pending != '0'
        uses: astral-sh/setup-uv@v6

      - name: Cache background-removal model
        if: steps.prepare.outputs.pending != '0'
        uses: actions/cache@v4
        with:
          path: |
            ~/.u2net
            ~/.rembg
          key: rembg-birefnet-general-lite-v1

      - name: Cut out new photos
        if: steps.prepare.outputs.pending != '0'
        working-directory: site
        run: uv run --python 3.12 pipeline/cutout.py .cache/pending.json cutouts

      - name: Build
        working-directory: site
        env:
          VAULT_DIR: ../vault
        run: |
          npx astro build
          node scripts/check-dist.ts

      - name: Deploy to Cloudflare Pages
        working-directory: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >
          npx --yes wrangler@4 pages deploy dist
          --project-name bebi --branch main --commit-dirty=true
          --commit-hash "${{ github.sha }}"
          --commit-message "${{ github.repository }}@${{ github.sha }}"

      - name: Save new cutouts
        working-directory: site
        run: |
          if [ -z "$(git status --porcelain cutouts)" ]; then echo "no new cutouts"; exit 0; fi
          git config user.name "bebi-publish"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cutouts
          git commit -m "cutouts: $(git diff --cached --name-only cutouts | grep -c -v manifest.json) new [skip ci]"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
